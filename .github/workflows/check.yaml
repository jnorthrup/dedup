name: CI

on:
  push:
    branches-ignore: [ "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        version: [26, 15, 14]
    runs-on: macOS-${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
      - name: install dependencies
        shell: bash
        run: |
          brew install check xxhash aspell llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "CPPFLAGS=-I$(brew --prefix)/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - name: make check
        run: make check
      - name: check build isolation
        run: make check-build-system

  check-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: install check and filesystem tools
        run: |
          sudo apt-get update
          sudo apt-get install -y check pkg-config btrfs-progs xfsprogs e2fsprogs attr acl
      # root, to loop-mount the btrfs, XFS and ext4 images the tests use
      - name: make check-linux
        run: sudo make check-linux
