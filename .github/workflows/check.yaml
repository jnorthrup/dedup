name: CI

on:
  push:
    branches-ignore: [ "master" ]
  pull_request_target:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        version: [26, 15, 14]
    runs-on: macOS-${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
      # the Makefiles find check and xxhash under /opt/homebrew
      - name: install dependencies
        run: brew install check xxhash
      - name: make check
        run: make check
