name: CI

on:
  push:
    branches-ignore: [ "master" ]
  pull_request_target:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        version: [26, 15, 14]
    runs-on: macOS-${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
      # the Makefiles find check and xxhash under /opt/homebrew
      - name: install dependencies
        run: brew install check xxhash
      - name: make check
        run: make check

  check-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: install check and filesystem tools
        run: |
          sudo apt-get update
          sudo apt-get install -y check pkg-config btrfs-progs xfsprogs e2fsprogs attr acl
      # root, to loop-mount the btrfs, XFS and ext4 images the tests use
      - name: make check-linux
        run: sudo make check-linux
